name: Ingest MiFi submissions

# The MiFi app files an issue titled "[MiFi] add: ..." or "[MiFi] report: ...".
# This workflow validates it, writes it into data/tiles/<geohash>.json, and closes the issue.
# NOTE: issue-triggered workflows only run from the default branch.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: mifi-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[MiFi]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Process submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python3 scripts/ingest.py

      - name: Commit data
        id: commit
        run: |
          git config user.name "mifi-bot"
          git config user.email "mifi-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: ingest #${{ github.event.issue.number }}"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          MSG=$(cat result.txt)
          gh issue comment "$NUMBER" --body "$MSG"
          gh issue close "$NUMBER" --reason completed
