name: MiFi
options:
  bundleIdPrefix: com.dalexen
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MIFI_GH_CLIENT_ID: ""
targets:
  MiFi:
    type: application
    platform: iOS
    sources:
      - MiFi
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MiFi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIDesignRequiresCompatibility: true
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        MiFiGitHubClientID: "$(MIFI_GH_CLIENT_ID)"
        NSLocationWhenInUseUsageDescription: MiFi uses your location to show Wi-Fi networks near you and to place networks you share on the map.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dalexen.mifi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
